# Production override — for exposure beyond the LAN (Cloudflare Tunnel → Traefik).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base file stays the review stack described in DECISIONS.md C5: `docker compose
# up` still brings up the Vite dev server, unchanged. This override is the deployment
# path added by A1, and it differs in three ways:
#
#   1. the frontend is a built SPA served by Caddy, not a dev server;
#   2. Caddy proxies /api to the backend, so the browser sees a single origin —
#      no CORS, and the baked API base URL is the relative `/api/v1`;
#   3. the database and the API stop publishing host ports. Once a reverse proxy
#      routes the hostname, the only way in should be the reverse proxy.
#
# `!reset` is required because Compose *appends* list values like `ports` when
# merging files; assigning an empty list would otherwise leave the base entry.

services:
  db:
    # Never reachable from outside the Compose network.
    ports: !reset []

  backend:
    # Same-origin means the browser never sends a cross-origin request to the API,
    # so no allowlist is needed. Leaving a stale LAN origin here would be the kind
    # of permission nobody notices until it is abused.
    ports: !reset []
    environment:
      CORS_ALLOWED_ORIGINS: ""

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Relative on purpose: the image is hostname-agnostic, so promoting it to a
        # different domain needs no rebuild.
        VITE_API_BASE_URL: /api/v1
    # The dev server's runtime variables do not apply to a built bundle.
    environment: !reset {}
    ports:
      # Host port kept for parity with the review stack, now pointing at Caddy.
      # It can be dropped entirely once the reverse proxy fronts the container.
      - ${FRONTEND_PORT:-5173}:80
